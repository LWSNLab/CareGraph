[project]
name = "caregraph-pipelines"
version = "0.1.0"
description = "CareGraph ingestion pipelines: web scraping, PDF parsing, and geocoding."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.47",
    "polars>=1.0",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Treat this as an application (managed deps + venv), not an installable package.
# Avoids a build backend and its packaging requirements.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# Explicit ruleset so CI and local runs agree regardless of the environment.
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]
# Scrapers deliberately swallow every network/parse error and carry on; the
# run report is what surfaces failures, not an exception per element.
ignore = ["B904"]
