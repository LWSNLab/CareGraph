name: CI

# Build, lint and test on every change. Pulled forward from story E4-S2 so the
# test suite actually guards the repo; image builds and deployment remain part
# of E4-S2 and are NOT covered here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build · vet · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  python:
    name: Python pipelines (lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines

    # PostGIS for the loader's integration tests. Without it they skip, which
    # would leave the database code effectively untested in CI.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: caregraph
          POSTGRES_PASSWORD: caregraph
          POSTGRES_DB: caregraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caregraph -d caregraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CAREGRAPH_TEST_DSN: postgres://caregraph:caregraph@localhost:5432/caregraph?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pipelines/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      # A service container does not run docker-entrypoint-initdb.d, so the
      # migrations have to be applied explicitly here.
      - name: Apply database migrations
        working-directory: ${{ github.workspace }}
        env:
          PGPASSWORD: caregraph
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            echo "applying $migration"
            psql -h localhost -U caregraph -d caregraph -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Test
        # Run from the repo root so `pipelines` imports as a package.
        # Tests needing the (gitignored) GKV PDF skip themselves.
        working-directory: ${{ github.workspace }}
        run: uv run --project pipelines pytest pipelines/tests -q
