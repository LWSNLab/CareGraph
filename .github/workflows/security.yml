name: Security

# Supply-chain and secret checks that work on private repositories at no cost,
# complementing CodeQL (which needs a public repo or Advanced Security) and
# Dependabot alerts.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly: new advisories appear for code that has not changed.
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go-vulns:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      # govulncheck reports only vulnerabilities that are actually reachable
      # from our code, which keeps the signal-to-noise ratio usable.
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
          repo-checkout: false

  python-vulns:
    name: Python vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: pipelines/pyproject.toml

      - name: Export the resolved dependency set
        working-directory: pipelines
        run: uv export --format requirements-txt --all-groups --no-emit-project -o requirements-audit.txt

      - name: Audit dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: pipelines/requirements-audit.txt

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip
      # Stands in for GitHub Secret Protection, which is billed on private
      # repos. Worth keeping even afterwards: it also runs on pull requests
      # from forks and covers the full history.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (PR)
    # Blocks pull requests that introduce known-vulnerable dependencies.
    # Requires a public repo or Advanced Security, hence the same guard as CodeQL.
    if: github.event_name == 'pull_request' && (github.event.repository.visibility == 'public' || vars.ENABLE_CODEQL == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
