name: caregraph

# Local development stack. Infra (db, typesense, redis) starts by default;
# the Go API is behind the "app" profile so `docker compose up` works before
# the Go build is wired (run `make tidy` first, then `--profile app`).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caregraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caregraph}
      POSTGRES_DB: ${POSTGRES_DB:-caregraph}
    ports:
      # 5432 is often taken by a local Postgres install; override with POSTGRES_PORT.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # *.sql here run automatically on first initialization of an empty volume.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caregraph} -d ${POSTGRES_DB:-caregraph}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  typesense:
    image: typesense/typesense:0.25.2
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-devkey}", "--enable-cors"]
    # Loopback only, like redis: the dev key is `devkey`, so publishing this on
    # 0.0.0.0 would hand write access to the index to the local network. The API
    # reaches it over the `internal` network; this mapping is for running the
    # sync worker and the gateway outside compose.
    ports:
      # Loopback binding kept; only the host port moves. Overridable for the same
      # reason as the others: a port already in use must not make the stack
      # unstartable for someone who did not write this file.
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"
    # This check never once passed before 2026-08-17: it called `curl`, and the
    # typesense image has no curl — nor wget, nc or python3. The container was
    # permanently "unhealthy" while /health answered {"ok":true} the whole time.
    # Nothing broke, because `api` only waited for service_started — which is
    # precisely why it went unnoticed for so long. It waits for healthy now.
    #
    # bash is the only thing in the image that can speak to a socket, so the
    # probe uses its /dev/tcp and greps the response body. Checking only that the
    # port accepts would report healthy while Typesense was still loading its
    # index from disk.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q ''"ok":true'' <&3'
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - typesense_data:/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Bound to the loopback interface on purpose: this Redis has no password, so
    # publishing it on 0.0.0.0 would hand the rate-limit state to anyone on the
    # local network. The API reaches it over the `internal` network either way;
    # the mapping exists only for running the Go gateway outside compose.
    ports:
      # 6379 is occupied on any machine that already runs a Redis, which is most
      # of them. Loopback binding kept — see the note above.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CAREGRAPH_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-caregraph}:${POSTGRES_PASSWORD:-caregraph}@db:5432/${POSTGRES_DB:-caregraph}?sslmode=disable
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-devkey}
      REDIS_ADDR: redis:6379
      # The API refuses an unencrypted connection to a host that is not local,
      # and `db` is not local as far as the process can tell — from inside a
      # container there is no way to distinguish this private bridge network
      # from the open internet. This says "the operator knows it is one host".
      # A deployment across machines must drop this and use sslmode=require.
      CAREGRAPH_ALLOW_INSECURE_DB: "1"
    ports:
      # Overridable like POSTGRES_PORT: 8080 is a busy port on a developer
      # machine, and a self-hoster should not have to edit this file.
      - "${CAREGRAPH_PORT:-8080}:8080"
    # No healthcheck here on purpose: the image declares its own HEALTHCHECK
    # (the binary probes its /readyz, since distroless has no shell to call
    # curl from). Repeating it here would be a second definition to keep in step.
    #
    # Above the API's own 20 s shutdown timeout, otherwise Docker sends SIGKILL
    # while requests are still draining and the graceful stop is pointless.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        # Now that the check actually works, wait for healthy rather than
        # started: /search answers 503 until the index is loaded, and a
        # container that is up is not the same as one that can answer.
        condition: service_healthy
    networks: [internal]

  # Ingestion pipelines. A batch job, not a service: it runs to completion and
  # exits, so it sits behind its own profile and is invoked with `run`, never
  # `up`. See the Makefile targets, or directly:
  #
  #   docker compose --profile ingest run --rm ingest -m pipelines.run_dataset export
  #
  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile.ingest
    environment:
      # The write-scoped role, not the API's read-only one — a load fails on the
      # first INSERT otherwise. Falls back to the owner because `caregraph_ingest`
      # has no password until `make db-roles-dev` has run against the container.
      INGEST_DATABASE_URL: postgres://${POSTGRES_USER:-caregraph}:${POSTGRES_PASSWORD:-caregraph}@db:5432/${POSTGRES_DB:-caregraph}?sslmode=disable
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-devkey}
      # Same reason as the api service above.
      CAREGRAPH_ALLOW_INSECURE_DB: "1"
    volumes:
      # Inputs and outputs live on the host: the raw sources are hundreds of
      # megabytes and are deliberately not in the image, and a dataset archive
      # is the artefact a release publishes.
      - ./pipelines/data:/app/pipelines/data
      - ./dist:/app/dist
    depends_on:
      db:
        condition: service_healthy
      typesense:
        condition: service_healthy
    networks: [internal]

volumes:
  db_data:
  typesense_data:

networks:
  internal:
    driver: bridge
